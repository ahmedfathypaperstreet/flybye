name: flybye
description: FlyBye — meet verified travelers at your airport.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend / auth
  supabase_flutter: ^2.5.6

  # State / routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # IAP — disabled for v1.0 due to an iOS 26 SIGKILL on purchases_flutter 8.x.
  # Re-enable in v1.1 with 9.x: see REVENUECAT_REENABLE.md (device test required).
  # purchases_flutter: ^9.15.0

  # UI / utils
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Camera / photos
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Misc
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - .env
    - brand/logos/
