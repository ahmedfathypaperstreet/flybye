  <g transform="translate(30,30) rotate(-30)">
    <ellipse cx="0" cy="0" rx="18" ry="5" fill="url(#hIconGrad)"/>
    <path d="M2,-3 L-6,-14 L-11,-10 L-3,-2 Z" fill="url(#hIconGrad)"/>
    <path d="M2,3 L-6,14 L-11,10 L-3,2 Z" fill="url(#hIconGrad)" opacity="0.8"/>
    <path d="M-14,-2 L-19,-8 L-16,-6 L-16,0 Z" fill="url(#hIconGrad)"/>
    <ellipse cx="16" cy="0" rx="4" ry="3" fill="url(#hIconGrad)"/>
  </g>

  <!-- Divider dot -->
  <circle cx="68" cy="30" r="2.5" fill="#0EA5C9" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="80" y="43" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="36" fill="url(#hTextGrad)" letter-spacing="-0.5">FlyBye</text>
</svg>
